name: test-and-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Licenses and advisories
        uses: EmbarkStudios/cargo-deny-action@v2

  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 so the Linux executables run on older glibc too.
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build executables
        run: cargo build --release --workspace --locked

      - name: Smoke-test CLI executable
        shell: bash
        run: |
          cli=target/release/imr-chart-cli
          $cli --version
          $cli tests/golden/smoke/smoke.csv -c Value --lsl 2e7 -o smoke_out
          test -s smoke_out/IMR_Value.png && test -s smoke_out/IMR_Value.html && test -s smoke_out/IMR_Value.xlsx
          # The app runs the command line when given options.
          target/release/imr-chart tests/golden/smoke/smoke.csv -c Value --formats xlsx -o smoke_out/app | grep -q "n=4"

      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"

      - name: Excel formulas recompute the workbooks
        if: runner.os == 'Linux'
        run: |
          python -m pip install formulas openpyxl
          bash tests/golden/verify_xlsx.sh python

      - uses: actions/upload-artifact@v4
        with:
          name: imr-chart-${{ runner.os }}
          path: |
            target/release/imr-chart${{ runner.os == 'Windows' && '.exe' || '' }}
            target/release/imr-chart-cli${{ runner.os == 'Windows' && '.exe' || '' }}
            licenses/

  # After every successful build on main, publish the executables as a public GitHub Release
  # (downloadable by anyone, no GitHub account needed; the artifacts above need a login and expire).
  # The release is named after the program version; pushing again without a version bump replaces
  # it, so its tag always points at the commit the files were built from.
  release:
    needs: [lint, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v${version}"
          mkdir release
          cp imr-chart-Windows/target/release/imr-chart.exe imr-chart-Windows/target/release/imr-chart-cli.exe release/
          cp imr-chart-Linux/target/release/imr-chart release/imr-chart-linux
          cp imr-chart-Linux/target/release/imr-chart-cli release/imr-chart-cli-linux
          (cd release && sha256sum imr-chart.exe imr-chart-cli.exe imr-chart-linux imr-chart-cli-linux > SHA256SUMS.txt)
          cp licenses/*.txt release/
          cat > notes.md <<NOTES
          Built from commit ${GITHUB_SHA::7} after all tests passed.

          - **Windows:** download **imr-chart.exe** and double-click it (\`imr-chart-cli.exe\` is the command-line version).
            Windows may show a SmartScreen warning because the exe isn't code-signed: click *More info* → *Run anyway*.
          - **Linux:** download **imr-chart-linux**, run \`chmod +x imr-chart-linux\`, then run it.
          - **SHA256SUMS.txt** lists each file's fingerprint.
          - The licences of the embedded fonts and plotly.js are included.
          NOTES
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" release/* --target "$GITHUB_SHA" --latest \
            --title "I-MR Chart Builder $tag" --notes-file notes.md
