[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imr-chart"
version = "1.0.0"
description = "Individual & Moving Range (I-MR) control chart generator for Excel/CSV QC data"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-qt>=4.4", "pyinstaller>=6.10",
       "formulas>=1.2"]  # evaluates the Verification sheet's Excel formulas in tests

[project.scripts]
imr-chart = "imr_chart.__main__:main"

[tool.setuptools]
packages = ["imr_chart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"

[tool.coverage.run]
source = ["imr_chart"]
