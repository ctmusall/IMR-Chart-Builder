name: test-and-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest --cov=imr_chart --cov-report=term-missing

      - name: Build executables
        run: python -m PyInstaller --noconfirm --clean imr_chart.spec

      - name: Smoke-test CLI executable
        shell: bash
        run: |
          ./dist/imr-chart-cli --version
          printf 'QC Lot,Date Processed,Value\nA,2024-01-01,5e7\nB,2024-01-02,7e7\nC,2024-01-03,6e7\nD,2024-01-04,1e7\n' > smoke.csv
          ./dist/imr-chart-cli smoke.csv -c Value --lsl 2e7 -o smoke_out
          test -s smoke_out/IMR_Value.png && test -s smoke_out/IMR_Value.html && test -s smoke_out/IMR_Value.xlsx

      - uses: actions/upload-artifact@v4
        with:
          name: imr-chart-${{ runner.os }}
          path: dist/*

  # After every successful build on main, publish the executables as a public GitHub Release
  # (downloadable by anyone, no GitHub account needed; the artifacts above need a login and expire).
  # The release is named after the program version; pushing again without a version bump replaces
  # it, so its tag always points at the commit the files were built from.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' imr_chart/__init__.py)
          tag="v${version}"
          mkdir release
          cp imr-chart-Windows/imr-chart.exe imr-chart-Windows/imr-chart-cli.exe release/
          cp imr-chart-Linux/imr-chart release/imr-chart-linux
          cp imr-chart-Linux/imr-chart-cli release/imr-chart-cli-linux
          (cd release && sha256sum * > SHA256SUMS.txt)
          cat > notes.md <<NOTES
          Built from commit ${GITHUB_SHA::7} after all tests passed.

          - **Windows:** download **imr-chart.exe** and double-click it (\`imr-chart-cli.exe\` is the command-line version).
            Windows may show a SmartScreen warning because the exe isn't code-signed: click *More info* → *Run anyway*.
          - **Linux:** download **imr-chart-linux**, run \`chmod +x imr-chart-linux\`, then run it.
          - **SHA256SUMS.txt** lists each file's fingerprint.
          NOTES
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" release/* --target "$GITHUB_SHA" --latest \
            --title "I-MR Chart Builder $tag" --notes-file notes.md
