[workspace]
resolver = "3"
members = ["crates/imr-core", "crates/imr-cli"]

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.95"
description = "Individual & Moving Range (I-MR) control charts from Excel or CSV QC exports"

[workspace.dependencies]
imr-core = { path = "crates/imr-core" }
imr-cli = { path = "crates/imr-cli" }
assert_cmd = "2"
base64 = "0.22"
caseless = "0.2"
calamine = { version = "0.37", features = ["chrono"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
regex = "1"
rust_xlsxwriter = { version = "0.102", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
