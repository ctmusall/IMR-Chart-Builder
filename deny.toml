# cargo-deny: licenses, security advisories and crate sources of every dependency.
# Run with `cargo deny check` (CI does).

[graph]
all-features = false

[advisories]
# Fail on known vulnerabilities and on crates that are unmaintained or yanked.
yanked = "deny"
ignore = [
    # Unmaintained (not vulnerable): text shaping and font parsing inside resvg, which draws the
    # chart image. Revisit when resvg moves to a maintained font stack.
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz, via usvg 0.45 (chart text)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, via usvg 0.45 and chart text measurement" },
    # Merged into zbus 6 (not vulnerable); used by the Linux screen-reader bridge (accesskit / AT-SPI) and
    # file dialogs (xdg-portal). Goes away when egui / rfd move to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant, via accesskit_unix and rfd" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, via accesskit_unix and rfd" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, via accesskit_unix and rfd" },
]

[licenses]
# Permissive licenses only.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # The app's UI font (Ubuntu Light, via egui); its licence is in licenses/.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9
# Allowed ahead of the chart and app crates, which pull in more dependencies.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates aren't published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
