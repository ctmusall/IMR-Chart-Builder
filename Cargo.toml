[workspace]
resolver = "3"
members = ["crates/imr-core", "crates/imr-charts", "crates/imr-cli", "crates/imr-gui"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
description = "Individual & Moving Range (I-MR) control charts from Excel or CSV QC exports"

[workspace.dependencies]
imr-core = { path = "crates/imr-core" }
imr-charts = { path = "crates/imr-charts" }
imr-cli = { path = "crates/imr-cli" }
assert_cmd = "2"
base64 = "0.23"
caseless = "0.2"
calamine = { version = "0.37", features = ["chrono"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "wayland", "wgpu", "x11"] }
egui = "0.37"
egui_plot = "0.38"
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
epaint_default_fonts = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"
rfd = "0.17"
# resvg draws the chart image; it brings usvg (SVG parsing, text) and tiny-skia.
resvg = { version = "0.49", default-features = false, features = ["text"] }
rust_xlsxwriter = { version = "0.102", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
ttf-parser = "0.25"
winresource = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
